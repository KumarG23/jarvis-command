# P10: Done/live; phone check pending. New-family eligibility stays deferred; only existing approved free/included allowlisted routes are selectable. Evidence: §11 P10 / https://github.com/KumarG23/jarvis-command/pull/75#issuecomment-6547754852 and https://github.com/KumarG23/jarvis-command/issues/20#issuecomment-6558299788
  - id: P10
    title: Model catalog
    acceptance:
