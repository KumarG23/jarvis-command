# SOURCE ONLY: install as jarvis-command-app.service.d/command-storage.conf
# ONLY in the future approved v0.2 transaction, after stopping/quiescing the app,
# installing trusted helpers/config, and explicit first-time storage preparation.
# No auto-enablement. The v0.1 release scripts must not install this override.
[Service]
ExecStart=
ExecStart=/usr/local/libexec/jarvis-command-supervised-command-app --monitor
# Never inherit name-based cleanup. systemd preserves INVOCATION_ID for post-stop.
ExecStop=
ExecStopPost=
ExecStopPost=/usr/local/libexec/jarvis-command-supervised-command-app --cleanup
StateDirectory=jarvis-command-supervisor
StateDirectoryMode=0700
TimeoutStartSec=180
TimeoutStopSec=150
KillMode=control-group
