# Restrict the dedicated bridge account to one reverse loopback listener.
Match User jarvis-bridge
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding remote
    GatewayPorts no
    PermitListen 127.0.0.1:18642
    PermitOpen none
    PermitUserRC no
    MaxSessions 0
