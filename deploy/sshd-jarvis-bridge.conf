# Restrict the dedicated bridge account to exactly two reverse loopback listeners.
Match User jarvis-bridge
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding remote
    AllowStreamLocalForwarding no
    GatewayPorts no
    PermitListen 127.0.0.1:18642 127.0.0.1:18643
    PermitOpen none
    PermitUserRC no
    MaxSessions 0
