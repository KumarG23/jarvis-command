name: PR validation

# Source validation only. This is not code review, a live deployment check or
# physical Android acceptance.
on:
  pull_request:
    branches: [release/gpt6-sol-luna]
    types: [opened, synchronize, reopened, ready_for_review]

# Read-only token; no secrets, deploy keys, artifacts or self-hosted runners.
permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    # Draft PRs skip, so hosted-run cost starts only when an owner marks ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3 # matches the Dockerfile runtime
          cache: npm
      - run: npm ci
      - name: Install Chromium for the browser regression
        if: hashFiles('e2e/header-layout.config.ts') != ''
        run: npx playwright install --with-deps chromium
      - run: scripts/ci-validate.sh
