<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Jarvis viewport preview</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;background:#20252e;color:#eef1f6;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center}button{padding:8px 12px}iframe{display:block;border:1px solid #647085;margin:0 16px 16px;width:390px;height:844px}</style></head>
<body><header><strong>Synthetic viewport preview</strong><button data-size="390,844">Phone 390</button><button data-size="320,640">Narrow 320</button><button data-size="844,390">Landscape</button></header><iframe title="Jarvis mobile preview" src="/index.html"></iframe><script type="module">for(const button of document.querySelectorAll('button'))button.addEventListener('click',()=>{const [width,height]=button.dataset.size.split(',');const frame=document.querySelector('iframe');frame.style.width=width+'px';frame.style.height=height+'px';});</script></body></html>
